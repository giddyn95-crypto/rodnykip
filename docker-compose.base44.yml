services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      # Persist node_modules across container recreations (keeps the bind-mount clean).
      - node_modules:/app/node_modules
    ports:
      - "3000:4003"
    env_file:
      - ./.env.base44-defaults   # placeholders — app boots without credentials
      - /run/base44/app.env      # platform secrets — LAST, always wins
    environment:
      # Bind-mounts often need polling for file-watch events to fire.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "npm install --legacy-peer-deps && npx rsbuild dev --host 0.0.0.0 --port 4003"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4003/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  node_modules:
